plugins {
    id 'com.gtnewhorizons.gtnhconvention'
}

// The GTNH convention resolves dependencies from Maven Central, the GTNH nexus, and
// overminddl1 -- none of which carry com.github.GTNewHorizons:CodeChickenLib:1.3.0. That
// artifact is published through JitPack (its source repo ships jitpack.yml and was archived
// two days after 1.3.0), and GT5-Unofficial pulls it in transitively via
// ThaumicTinkerer -> ThaumicBoots -> Thaumic_Exploration. Without this a cold build fails:
//
//   Could not find com.github.GTNewHorizons:CodeChickenLib:1.3.0
//
// Existing runners do not hit it because GTNH_ORACLE_BUILD_CACHE_DIR keeps a warm Gradle
// cache, so the artifact is never re-resolved. Bumping gtnhsettingsconvention to 2.0.26 does
// not help; JitPack is still absent from its repository list.
//
// Scoped to com.github.* so JitPack is consulted only for the groups that need it, rather
// than becoming a general-purpose fallback for every dependency in the build.
repositories {
    maven {
        name = "jitpack.io"
        url = "https://jitpack.io"
        content {
            includeGroupByRegex("com\\.github\\..*")
        }
    }
}
